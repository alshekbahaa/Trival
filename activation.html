<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفعيل AjwaaApp1</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #192a3e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #f6f4f0; color: #333; padding: 30px; border-radius: 10px; width: 350px; text-align: center; }
        .code-box { background: #e0e0e0; padding: 10px; font-family: monospace; font-size: 18px; color: #d32f2f; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px;}
        input { width: 90%; padding: 10px; text-align: center; font-family: monospace; font-size: 14px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;}
        button { background: #192a3e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px;}
        button:hover { background: #c5a059; color: #192a3e; font-weight: bold;}
        #err { color: red; display: none; margin-top: 10px; font-size: 14px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 تفعيل النظام</h2>
        <p>انسخ كود الجهاز وأرسله للإدارة:</p>
        <div class="code-box" id="machine-id">جاري التحميل...</div>
        <input type="text" id="key-input" placeholder="XXXX-XXXX-XXXX-XXXX">
        <button onclick="activate()">تفعيل</button>
        <div id="err">المفتاح غير صحيح!</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // جلب كود الجهاز عند فتح الشاشة
        ipcRenderer.invoke('get-machine-id').then(id => {
            document.getElementById('machine-id').innerText = id;
        });

        function activate() {
            const key = document.getElementById('key-input').value.trim();
            ipcRenderer.invoke('verify-license', key).then(isValid => {
                if(!isValid) document.getElementById('err').style.display = 'block';
            });
        }
    </script>
</body>
</html>
